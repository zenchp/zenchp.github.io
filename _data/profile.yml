short_bio: >-
  <p>
    Hi, I'm Jae Eun Lee — a postdoctoral researcher at the University of Oxford 
    originally from South Korea. I completed my PhD in Condensed Matter Physics 
    here at Oxford, and I've stayed on to continue pushing the boundaries of what 
    we understand about the materials that will shape our technological future.
  </p>

  <p>
    My research focuses on uncovering the fundamental charge-carrier dynamics in 
    novel semiconductors, using time-resolved spectroscopic techniques — primarily 
    Time-Resolved Photoluminescence (TRPL) and Terahertz (THz) spectroscopy — to 
    probe i processes across timescales ranging from femtoseconds to seconds.
  </p>

  <p>
    Looking ahead, I'm driven by the exciting challenges of discovering and 
    investigating new material systems with real-world impact — from next-generation 
    energy technologies to the emerging frontiers of AI hardware and quantum 
    computing. I believe that understanding materials at their most fundamental level 
    is key to unlocking the breakthroughs these fields demand.
  </p>

